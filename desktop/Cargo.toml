[package]
name = "cloudpass-desktop"
description = "CloudPass desktop client. Trusted client; all cryptography runs here in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Compiled as a library so the same entry point can later be used on mobile, where the
# platform loads a library instead of running a binary. Android loads a shared library
# (`cdylib`) and links against a static one (`staticlib`); Windows uses the `rlib`.
[lib]
name = "cloudpass_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri compiles itself in "dev" mode unless this feature is on: the asset protocol then
# proxies every request to a frontend dev server instead of serving the files embedded in
# the binary. On desktop that is invisible while `devUrl` is unset, but on Android there is
# no dev server and no way to reach one, so the app comes up to an error page instead of its
# own UI. Enable this for any build that ships.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cloudpass-client = { path = "../crates/cloudpass-client" }
cloudpass-core = { path = "../crates/cloudpass-core" }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
