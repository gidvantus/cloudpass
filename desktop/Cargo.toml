[package]
name = "cloudpass-desktop"
description = "CloudPass desktop client. Trusted client; all cryptography runs here in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Compiled as a library so the same entry point can later be used on mobile, where the
# platform loads a library instead of running a binary.
[lib]
name = "cloudpass_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cloudpass-client = { path = "../crates/cloudpass-client" }
cloudpass-core = { path = "../crates/cloudpass-core" }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
