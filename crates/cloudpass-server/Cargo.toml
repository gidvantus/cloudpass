[package]
name = "cloudpass-server"
description = "CloudPass sync server. Stores only opaque ciphertext and public metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cloudpass-core = { path = "../cloudpass-core" }

axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
# The client crate is a dev-dependency only, and only so that `tests/interop.rs` can
# drive the real sync engine against the real router. The server itself must never
# depend on a client: that would invert the trust relationship the design rests on.
cloudpass-client = { path = "../cloudpass-client" }

[[bin]]
name = "cloudpass-server"
path = "src/main.rs"
