[workspace]
resolver = "2"
members = [
    "desktop",
    "web/web",
    "web/server",
    "crates/cloudpass-client",
    "crates/cloudpass-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "proprietary"

[workspace.dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
thiserror = "1"
hex = "0.4"
# Published desktop build versions: the server parses one out of an installer's file
# name, and the desktop client compares it with the version it was built as. Both sides
# must agree on what "1.2.3" means, which is the whole reason this is a crate and not a
# hand-rolled split on dots.
semver = "1"
opaque-ke = { version = "4.0", features = ["ristretto255"] }

# Device identity and vault-head signatures. Already in the dependency tree through
# opaque-ke's curve25519 dependency, so this adds no second elliptic-curve stack.
ed25519-dalek = "2"

# Server side. sqlx is pinned to the SQLite driver with default features off, and
# deliberately without the `migrate` feature: that one pulls `sqlx-macros`, which in
# turn brings in the MySQL and Postgres drivers. The schema is applied with
# `raw_sql` instead, which keeps the dependency tree small — a supply-chain win, and
# this project treats that as a security property, not a nicety.
axum = "0.8"
# `time` is declared here rather than left to be switched on by whichever dependency
# happens to need it: the desktop's update check sleeps between polls, and a feature that
# exists only by accident of feature unification is a feature that disappears the day the
# dependency graph changes.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
